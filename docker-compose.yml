
services:
  postgres:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  otp-service:
    build: ./otp
    container_name: otp-service
    image: heisamit/otp-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:otp_db
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=sahaamit20002@gmail.com
      - SPRING_MAIL_PASSWORD=mryb srze cddf jrsm
    ports:
      - "8082:8080"
    networks:
      - app-network
    depends_on:
      - postgres
    

  user-service:
    build: ./user
    container_name: user-service
    image: heisamit/user-service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
    - "8081:8080"  # Exposing container's port 8080 as host's port 8081
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./ApiGateway  # Path to your API Gateway directory
    container_name: api-gateway
    image: heisamit/api-gateway:latest
    ports:
      - "8080:8080"     # Expose gateway to external clients
    networks:
      - app-network
    depends_on:
      - user-service
      - otp-service
      - postgres
      - payment-service

  payment-service:
    build: ./payment
    container_name: payment-service
    image: heisamit/payment-service:latest
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:payment_db
      - SPRING_PROFILES_ACTIVE=mock
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    networks:
      - app-network


volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge