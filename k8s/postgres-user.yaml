# postgres-user.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-user
  namespace: railway-system
spec:
  serviceName: postgres-user # Required for StatefulSet network identity
  replicas: 1
  selector:
    matchLabels:
      app: postgres-user
  template:
    metadata:
      labels:
        app: postgres-user
    spec:
      containers:
        - name: postgres-user
          image: postgres:14-alpine
          env:
            - name: POSTGRES_DB
              value: "user_service_db"
            - name: POSTGRES_USER
              value: "user_admin"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-user-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U user_admin -d user_service_db
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates: # Dynamic PVC creation for StatefulSet
    - metadata:
        name: postgres-user-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        # storageClassName: standard  # Uncomment if needed

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-user
  namespace: railway-system
spec:
  clusterIP: None # Headless service for StatefulSet
  selector:
    app: postgres-user
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
