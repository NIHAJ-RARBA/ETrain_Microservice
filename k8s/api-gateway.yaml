apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: railway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: heisamit/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: USER_SERVICE_PORT
              value: "80"
            - name: OTP_SERVICE_PORT
              value: "80"
            - name: PAYMENT_SERVICE_PORT
              value: "80"
            - name: TRAIN_SERVICE_PORT
              value: "80"
            - name: COACH_SEAT_SERVICE_PORT
              value: "80"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: railway-system
spec:
  type: ClusterIP # Changed from LoadBalancer
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: railway-system # Ensure this matches the namespace in your Deployment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway # This should match the name of your Deployment
  minReplicas: 2 # Minimum number of pods
  maxReplicas: 10 # Maximum number of pods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50 # Scale up when CPU utilization exceeds 60%