apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-service
  namespace: railway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: train-service
  template:
    metadata:
      labels:
        app: train-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.28
          command:
            [
              "sh",
              "-c",
              'until nc -z postgres-train 5432; do echo "Waiting for PostgreSQL"; sleep 2; done;',
            ]
      containers:
        - name: train-service
          image: heisamit/train-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-train:5432/train_service_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "train_admin"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234"
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 120
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health
          #     port: 8080
          #   initialDelaySeconds: 90
          #   periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: train-service
  namespace: railway-system
spec:
  selector:
    app: train-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
