apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: railway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: heisamit/user-service:latest
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-user:5432/user_service_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "user_admin"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: railway-system
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080